<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>PSE Nova Santa Rita mudou de endereço</title>
  <link rel="canonical" href="https://missoesdocaramelito.onrender.com/">
  <meta http-equiv="refresh" content="0; url=https://missoesdocaramelito.onrender.com/">
  <script>
    // O site saiu do GitHub Pages: leva cada endereço antigo para o mesmo
    // caminho no servidor novo (este arquivo também é o 404.html do Pages).
    (function () {
      var destino = "https://missoesdocaramelito.onrender.com";
      var caminho = location.pathname.replace(/^\/sms_nova_santa_rita/, "") || "/";
      if (/^\/portal(\/|$)/.test(caminho)) caminho = "/entrar/";
      else if (/^\/jogo(\/|$)/.test(caminho)) caminho = "/jogo/index.html";
      location.replace(destino + caminho + location.search + location.hash);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #fffdf6; color: #23402e; text-align: center; padding: 16px; }
    a { color: #26713a; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>O PSE Nova Santa Rita mudou de endereço</h1>
    <p><a href="https://missoesdocaramelito.onrender.com/">Ir para o novo site</a></p>
  </main>
</body>
</html>

name: Redirect GitHub Pages to Render

# O site completo (landing + /jogo/ + portal) agora é servido pelo serviço do
# Render (render.yaml, rootDir portal). O GitHub Pages só publica um
# redirecionamento para que links e QR codes antigos continuem funcionando:
# pages-redirect/index.html vira também o 404.html, então qualquer caminho
# antigo /sms_nova_santa_rita/... vai para o mesmo caminho no Render.

on:
  push:
    branches: [main]
    paths:
      - "pages-redirect/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble redirect site
        run: |
          mkdir -p redirect-site
          cp pages-redirect/index.html redirect-site/index.html
          cp pages-redirect/index.html redirect-site/404.html
          touch redirect-site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./redirect-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<!-- BUNDLE-PLACEHOLDER: jogo web ainda nao exportado.
     O export do Heroes_Trial (tools/export_web.ps1) substitui esta
     pasta inteira; rode o script e sincronize com
     `node scripts/sync-bundles.mjs --jogo` no repositorio da landing. -->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogar — PSE Nova Santa Rita</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: system-ui, "Segoe UI", sans-serif;
        background: #fdf6e3;
        color: #3a3a34;
      }
      .cartao {
        max-width: 26rem;
        text-align: center;
        background: #fffdf6;
        border: 2px solid #e7dcc3;
        border-radius: 22px;
        padding: 2.4rem 2rem;
        box-shadow: 0 10px 0 rgba(231, 220, 195, 0.55);
      }
      .pata {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 4rem;
        height: 4rem;
        border-radius: 50%;
        background: #3d9b4e;
        color: #fff;
        font-size: 2rem;
        box-shadow: 0 5px 0 #26713a;
      }
      h1 {
        margin: 1.2rem 0 0.5rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 1.4rem;
        line-height: 1.55;
        color: #6d6a5e;
      }
      a {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        border-radius: 999px;
        background: #3d9b4e;
        color: #fff;
        font-weight: 800;
        text-decoration: none;
        box-shadow: 0 5px 0 #26713a;
      }
      a:hover {
        background: #26713a;
      }
      small {
        display: block;
        margin-top: 1.2rem;
        color: #9b968a;
      }
    </style>
  </head>
  <body>
    <main class="cartao">
      <span class="pata" aria-hidden="true">🐾</span>
      <h1>O jogo está sendo preparado!</h1>
      <p>
        A versão para navegador do nosso jogo do Caramelinho está sendo
        empacotada e vai aparecer nesta página em breve.
      </p>
      <a href="../">Voltar para a página inicial</a>
      <small>Programa Saúde na Escola — Nova Santa Rita</small>
    </main>
  </body>
</html>
